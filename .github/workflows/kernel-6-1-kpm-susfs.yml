name: 内核构建 - 仅 6.1 (KPM + SUSFS)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 下拉选项 ====================
      kernelsu_variant:
        description: "KernelSU 变体（KPM 需 SukiSU/BakaSU，Official 不支持）"
        required: true
        type: choice
        options:
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - BakaSU
        default: BakaSU
      droidspaces:
        description: "Droidspaces 容器支持"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      sub_levels:
        description: "指定 6.1 小版本（逗号分隔，如 141,157,X；留空=全部）"
        required: false
        type: string
        default: ""
      release_type:
        description: "编译完成后自动发布到 Release"
        required: true
        type: choice
        options:
          - Release
          - Pre-Release
          - 不发布
        default: Release
      artifact_upload_mode:
        description: "构建产物上传模式"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
        default: "仅上传 AnyKernel3.zip"

      # ==================== 文本输入 ====================
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== 开关（默认关闭） ====================
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      use_nomount:
        description: "启用 NoMount 挂载元模块"
        required: false
        type: boolean
        default: false
      use_networking:
        description: "启用网络增强（BBRv3 / IPSet / Qdisc / CIFS）"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: false
        type: boolean
        default: false
      droidspaces_ntsync:
        description: "启用 Droidspaces 容器 NTSync 支持（需启用 Droidspaces）"
        required: false
        type: boolean
        default: false

jobs:
  # 从 kernel-a14-6-1.yml 读取 6.1 版本列表，按输入筛选出要编译的版本
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/workflows

      - name: 生成构建矩阵
        id: filter
        env:
          SUB_LEVELS: ${{ inputs.sub_levels }}
        run: |
          ALL=$(yq -o=json -I=0 '.jobs["build-kernels-a14-6-1"].strategy.matrix.include' .github/workflows/kernel-a14-6-1.yml)
          echo "可用版本: $(echo "$ALL" | jq -r '[.[].sub_level] | join(",")')"

          # 支持逗号/空格分隔，留空或 all 表示全部
          WANTED=$(echo "$SUB_LEVELS" | tr ', ' '\n\n' | sed '/^$/d' | jq -R . | jq -s -c .)
          if [ "$WANTED" = "[]" ] || echo "$WANTED" | jq -e 'map(ascii_downcase) | index("all")' >/dev/null; then
            MATRIX="$ALL"
          else
            UNKNOWN=$(jq -n -r --argjson all "$ALL" --argjson w "$WANTED" '$w - [$all[].sub_level] | join(",")')
            if [ -n "$UNKNOWN" ]; then
              echo "::error::未知的 6.1 版本: $UNKNOWN（可用: $(echo "$ALL" | jq -r '[.[].sub_level] | join(",")')）"
              exit 1
            fi
            MATRIX=$(jq -c -n --argjson all "$ALL" --argjson w "$WANTED" '[$all[] | select(.sub_level as $s | $w | index($s))]')
          fi

          echo "本次编译: $(echo "$MATRIX" | jq -r '[.[] | "6.1.\(.sub_level)"] | join(", ")')" | tee -a $GITHUB_STEP_SUMMARY
          echo "matrix={\"include\":$MATRIX}" >> $GITHUB_OUTPUT

  # 固定开启 KPM 与 SUSFS
  build-6-1-kpm-susfs:
    name: "6.1.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android14"
      kernel_version: "6.1"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: "enabled (开启)"
      use_rekernel: ${{ inputs.use_rekernel }}
      use_nomount: ${{ inputs.use_nomount }}
      use_networking: ${{ inputs.use_networking }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: false
      supp_op: false
      enable_susfs: true
      ksu_mode: 关闭
      droidspaces: ${{ inputs.droidspaces }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}

  get-ksu-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}

  # 编译完成后自动创建 Release，上传所有成功构建的内核与管理器
  release:
    if: ${{ always() && !cancelled() && inputs.release_type != '不发布' }}
    needs: [build-6-1-kpm-susfs, get-ksu-manager]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts

      - name: 整理发布文件
        run: |
          mkdir -p release-files
          cd downloaded-artifacts
          for dir in */; do
            dir="${dir%/}"
            case "$dir" in
              # 日志、冲突文件、补丁不发布
              *-Build-Logs|*-Rejects|SUSFS-Patch*) continue ;;
              # 「仅上传 AnyKernel3.zip」模式下产物是解压后的目录，重新打包成 zip
              *_kernel-*-AnyKernel3)
                (cd "$dir" && zip -r -9 -q "../../release-files/${dir}.zip" .) ;;
              *)
                find "$dir" -type f -exec cp {} ../release-files/ \; ;;
            esac
          done
          cd ..
          ls -la release-files
          if ! ls release-files | grep -q -i "anykernel3\|\.img$"; then
            echo "没有成功构建的内核，跳过发布" >&2
            echo "HAS_KERNEL=false" >> $GITHUB_ENV
          else
            echo "HAS_KERNEL=true" >> $GITHUB_ENV
          fi

      - name: 创建 GitHub Release
        if: env.HAS_KERNEL == 'true'
        run: |
          TAG="6.1-kpm-susfs-$(date -u +%Y%m%d)-r${{ github.run_number }}"
          PRERELEASE_FLAG=""
          if [ "${{ inputs.release_type }}" == "Pre-Release" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          cat > release_body.md << EOF
          ## GKI 6.1 内核 (KPM + SUSFS)

          | 项目 | 值 |
          |------|-----|
          | KernelSU 变体 | ${{ inputs.kernelsu_variant }} |
          | KPM | 开启 |
          | SUSFS | 开启 |
          | ZRAM | ${{ inputs.use_zram }} |
          | BBG | ${{ inputs.use_bbg }} |
          | 构建结果 | ${{ needs.build-6-1-kpm-susfs.result }} |
          | Actions 运行 | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |
          EOF
          sed -i 's/^          //' release_body.md

          gh release create "$TAG" release-files/* \
            --title "GKI 6.1 ${{ inputs.kernelsu_variant }} + KPM + SUSFS ($(date -u +%Y-%m-%d))" \
            --notes-file release_body.md \
            --target "$GITHUB_SHA" \
            $PRERELEASE_FLAG

          echo "## 发布已创建" >> $GITHUB_STEP_SUMMARY
          echo "${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG" >> $GITHUB_STEP_SUMMARY
